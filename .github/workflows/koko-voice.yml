name: Koko voice

# Actions › Koko voice › Run workflow. Needs the repo secret GOOGLE_TTS_API_KEY
# (Settings › Secrets and variables › Actions › New repository secret).
on:
  workflow_dispatch:
    inputs:
      lang:
        description: 'Language'
        type: choice
        options: [all, he, ru, en]
        default: all
      voice:
        description: 'Voice name (empty = default male WaveNet voice; type "list" to see the voices in the log)'
        required: false
        default: ''
      rate:
        description: 'Speaking rate'
        required: true
        default: '0.95'

permissions:
  contents: write

jobs:
  voice:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: List voices
        if: ${{ inputs.voice == 'list' }}
        env:
          GOOGLE_TTS_API_KEY: ${{ secrets.GOOGLE_TTS_API_KEY }}
          LANG_IN: ${{ inputs.lang }}
        run: python3 tools/make_audio.py --lang "$LANG_IN" --list
      - name: Generate the voice packs
        if: ${{ inputs.voice != 'list' }}
        env:
          GOOGLE_TTS_API_KEY: ${{ secrets.GOOGLE_TTS_API_KEY }}
          LANG_IN: ${{ inputs.lang }}
          VOICE: ${{ inputs.voice }}
          RATE: ${{ inputs.rate }}
        run: |
          if [ -n "$VOICE" ]; then python3 tools/make_audio.py --lang "$LANG_IN" --voice "$VOICE" --rate "$RATE";
          else python3 tools/make_audio.py --lang "$LANG_IN" --rate "$RATE"; fi
      - name: Commit
        if: ${{ inputs.voice != 'list' }}
        env:
          LANG_IN: ${{ inputs.lang }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Koko voice pack: $LANG_IN"
          git push
