/* Layout: a picture-book stage. An illustrated world fills the screen; Koko stands centre stage; big picture cards wait at the bottom. */
:root{
  --ink:#17383F;
  --ink-soft:#4C6A70;
  --card:#FFFFFF;
  --edge:#C3E1E6;
  --leaf:#2DB36F;
  --leaf-deep:#1C8B53;
  --sun:#FF9F1C;
  --sun-deep:#DD7D0A;
  --berry:#F2545B;
  --gold:#FFC93C;
  --sky-blue:#3A86FF;
  --cream:#FFF8E8;
  --scrim:rgba(23,56,63,.42);
  --tint:#FFE6B3;
  --on-world:var(--ink);
  --on-world-soft:var(--ink-soft);
  --display:"Fredoka","Varela Round","Arial Rounded MT Bold",system-ui,sans-serif;
  --body:"Varela Round","Rubik","Arial",system-ui,sans-serif;
  color-scheme:light;
}
#app[data-world="night"]{--on-world:#F3F6FF;--on-world-soft:#C9D4F5}
[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:#CFEFF7;color:var(--ink);font-family:var(--body);font-size:16px;overflow:hidden;
  touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;
}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:4px solid var(--sky-blue);outline-offset:3px}

/* ---------- world ---------- */
#world{position:fixed;inset:0;z-index:0;overflow:hidden;background:#CFEFF7}
#world .layer{position:absolute;inset:0;transition:opacity .6s ease}
#world .layer.in{opacity:0}
#world svg{width:100%;height:100%;display:block}
#world .cloud{animation:drift 40s ease-in-out infinite alternate}
#world .cloud:nth-of-type(2n){animation-duration:55s}
@keyframes drift{from{transform:translateX(calc(var(--dx) * -1))}to{transform:translateX(var(--dx))}}
#world .sun{transform-box:fill-box;transform-origin:center;animation:glow 6s ease-in-out infinite}
@keyframes glow{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
#world .star{animation:twinkle 3.2s ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:.35}50%{opacity:1}}
#world .firefly{animation:twinkle 2.4s ease-in-out infinite}
#world .butterfly{animation:flutter 4s ease-in-out infinite}
#world .butterfly.b2{animation-duration:5.2s}
@keyframes flutter{0%,100%{translate:0 0}50%{translate:30px -26px}}

#app{
  position:fixed;inset:0;z-index:1;
  padding:max(12px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(12px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));
}
.screen{position:relative;height:100%;width:100%}

/* ---------- Koko ---------- */
.koko-slot{aspect-ratio:360/430;max-width:100%}
.koko-slot .koko{width:100%;height:100%;display:block;overflow:visible}
.koko .bird{transform-box:view-box;transform-origin:150px 330px}
.koko .head{transform-box:view-box;transform-origin:150px 190px;transition:transform .35s ease}
.koko .wing-l{transform-box:view-box;transform-origin:88px 182px;transition:transform .3s ease}
.koko .wing-r{transform-box:view-box;transform-origin:212px 182px;transition:transform .3s ease}
.koko .eyes,.koko .beak-open,.koko .zzz{display:none}
.koko[data-mood="idle"] .eyes-open,.koko[data-mood="happy"] .eyes-happy,.koko[data-mood="sleep"] .eyes-closed,
.koko[data-mood="confused"] .eyes-confused,.koko[data-mood="wow"] .eyes-wow{display:inline}
.koko.blink[data-mood="idle"] .eyes-open{display:none}
.koko.blink[data-mood="idle"] .eyes-closed{display:inline}
.koko[data-mood="confused"] .head{transform:rotate(-9deg)}
.koko[data-mood="wow"] .head{transform:translateY(-6px)}
.koko .qmarks{opacity:0;transition:opacity .3s}
.koko[data-mood="confused"] .qmarks{opacity:1}
.koko[data-mood="sleep"] .zzz{display:inline}
.koko[data-mood="sleep"] .head{transform:rotate(7deg) translateY(6px)}
.koko.talking .beak-open{display:inline;animation:talkA .3s step-end infinite}
.koko.talking .beak-closed{animation:talkB .3s step-end infinite}
.koko.talking .wing-r{animation:gesture 1.6s ease-in-out infinite}
@keyframes gesture{0%,100%{transform:rotate(0)}50%{transform:rotate(-14deg)}}
@keyframes talkA{0%{opacity:1}50%{opacity:0}100%{opacity:0}}
@keyframes talkB{0%{opacity:0}50%{opacity:1}100%{opacity:1}}
.koko[data-mood="happy"] .bird{animation:hop .55s ease}
@keyframes hop{0%,100%{transform:translateY(0)}40%{transform:translateY(-22px)}}
.bob .bird{animation:bob 3.2s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.koko .zzz text{animation:zz 2.4s ease-in-out infinite}
.koko .zzz text:nth-child(2){animation-delay:.4s}
.koko .zzz text:nth-child(3){animation-delay:.8s}
@keyframes zz{0%,100%{opacity:.25}50%{opacity:1}}
/* acts */
.koko[data-act="flyin"] .bird{animation:flyin 1.1s cubic-bezier(.2,.8,.3,1) both}
.koko[data-act="flyin"] .wing-l{animation:flapL .18s ease-in-out 6 alternate}
.koko[data-act="flyin"] .wing-r{animation:flapR .18s ease-in-out 6 alternate}
@keyframes flyin{0%{transform:translate(-320px,-260px) rotate(-18deg) scale(.55);opacity:0}25%{opacity:1}100%{transform:none}}
.koko[data-act="flap"] .wing-l{animation:flapL .32s ease-in-out infinite alternate}
.koko[data-act="flap"] .wing-r{animation:flapR .32s ease-in-out infinite alternate}
.koko[data-act="flap"] .bird{animation:bob .64s ease-in-out infinite}
@keyframes flapL{from{transform:rotate(0)}to{transform:rotate(58deg)}}
@keyframes flapR{from{transform:rotate(0)}to{transform:rotate(-58deg)}}
.koko[data-act="jump"] .bird{animation:jump .62s cubic-bezier(.3,.7,.4,1) infinite}
@keyframes jump{0%,100%{transform:translateY(0) scaleY(1)}12%{transform:translateY(6px) scaleY(.92)}50%{transform:translateY(-70px) scaleY(1.04)}88%{transform:translateY(0) scaleY(.95)}}
.koko[data-act="spin"] .bird{animation:spin 1s ease-in-out infinite}
@keyframes spin{0%,100%{transform:scaleX(1)}50%{transform:scaleX(-1)}}
.koko[data-act="stomp"] .bird{animation:stomp .5s ease-in-out infinite alternate}
@keyframes stomp{from{transform:rotate(-7deg) translateY(4px)}to{transform:rotate(7deg) translateY(-6px)}}
.koko[data-act="tall"] .bird{animation:tall 1.4s ease-in-out infinite alternate}
.koko[data-act="tall"] .wing-l{transform:rotate(120deg)}
.koko[data-act="tall"] .wing-r{transform:rotate(-120deg)}
@keyframes tall{from{transform:scale(1,1)}to{transform:translateY(-14px) scale(.96,1.14)}}
.koko[data-act="small"] .bird{animation:small 1.4s ease-in-out infinite alternate}
@keyframes small{from{transform:scale(1)}to{transform:translateY(30px) scale(.72)}}
.koko[data-act="listen"] .head{transform:rotate(10deg)}
.koko[data-act="listen"] .wing-l{transform:rotate(26deg)}

/* things Koko wears or holds */
.koko .w{transform-box:view-box;transform-origin:0 0;transition:transform .9s cubic-bezier(.45,1.4,.5,1),opacity .35s ease,color .9s ease}
.koko .w.out{opacity:0}
.koko .w.pop{animation:wpop .5s ease}
@keyframes wpop{0%{opacity:0}100%{opacity:1}}

/* ---------- shared pieces ---------- */
.corner{position:absolute;top:0;inset-inline-end:0;z-index:5}
.hold{width:52px;height:52px;border-radius:50%;border:0;background:rgba(255,255,255,.78);display:grid;place-items:center;cursor:pointer;color:var(--ink-soft);box-shadow:0 3px 0 rgba(23,56,63,.12)}
.hold:not(.corner){position:relative}
.hold .ico{width:24px;height:24px}
.hold .ring{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.hold .ring circle{fill:none;stroke:var(--sun);stroke-width:4;stroke-linecap:round;stroke-dasharray:132;stroke-dashoffset:132}
.hold.holding .ring circle{transition:stroke-dashoffset 1.2s linear;stroke-dashoffset:0}
.hold-hint{position:absolute;top:58px;inset-inline-end:0;font-size:12px;color:var(--on-world-soft);white-space:nowrap;opacity:0;transition:opacity .2s;z-index:5;pointer-events:none}
.hold.holding + .hold-hint{opacity:1}
.bubble{
  position:relative;z-index:2;background:var(--card);border-radius:26px;padding:.4em 1em;max-width:min(94%,660px);min-height:1.9em;
  font-family:var(--display);font-weight:600;font-size:clamp(20px,4.2vmin,34px);line-height:1.25;text-align:center;
  box-shadow:0 5px 0 rgba(23,56,63,.14),0 14px 30px rgba(23,56,63,.12);text-wrap:balance
}
.bubble::after{content:"";position:absolute;bottom:-14px;left:50%;margin-left:-14px;border-width:16px 14px 0;border-style:solid;border-color:var(--card) transparent transparent}
.bubble:empty{visibility:hidden}

/* ---------- start ---------- */
.start{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(6px,1.4vh,16px);text-align:center;padding-top:56px}
.langs{position:absolute;top:0;inset-inline-start:0;display:flex;gap:6px;z-index:5;background:rgba(255,255,255,.72);padding:5px;border-radius:999px;box-shadow:0 3px 0 rgba(23,56,63,.1)}
.langs button{border:0;background:transparent;border-radius:999px;padding:8px 12px;font-family:var(--display);font-weight:600;font-size:15px;cursor:pointer;color:var(--ink-soft);min-height:42px}
.langs button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 2px 0 var(--edge)}
.start .koko-slot{height:min(36vh,64vw)}
.title{margin:0;font-family:var(--display);font-weight:700;line-height:.95;font-size:clamp(46px,10.5vmin,88px);text-wrap:balance;color:var(--on-world)}
.title .t1{color:var(--leaf-deep);text-shadow:0 4px 0 rgba(255,255,255,.7)}
.title .t2{font-weight:600;font-size:.56em;display:block;margin-top:.14em}
.tag{margin:0;font-family:var(--display);font-weight:500;font-size:clamp(18px,3.6vmin,27px);color:var(--on-world-soft)}
.play{
  width:clamp(104px,19vmin,140px);aspect-ratio:1;border-radius:50%;border:0;cursor:pointer;background:var(--sun);display:grid;place-items:center;
  box-shadow:0 9px 0 var(--sun-deep),0 18px 34px rgba(221,125,10,.32);transition:transform .12s ease,box-shadow .12s ease;margin-top:clamp(2px,1vh,10px);
  animation:breathe 2.6s ease-in-out infinite
}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
.play:active{animation:none;transform:translateY(7px);box-shadow:0 2px 0 var(--sun-deep),0 8px 18px rgba(221,125,10,.3)}
.play svg{width:46%;height:46%}
.play svg{margin-left:6%}
.meta{margin:clamp(4px,1.2vh,12px) 0 0;display:flex;flex-wrap:wrap;justify-content:center;gap:6px}
.meta span{white-space:nowrap;background:rgba(255,255,255,.75);padding:4px 10px;border-radius:999px;font-size:14px;color:var(--ink-soft)}
.voice-note{margin:0;font-size:14px;color:#A4540A;max-width:34em;background:rgba(255,255,255,.85);padding:6px 12px;border-radius:12px}
.rest{display:grid;gap:12px;justify-items:center;background:rgba(255,255,255,.9);border-radius:24px;padding:16px 20px;max-width:420px;box-shadow:0 6px 0 rgba(23,56,63,.12)}
.rest h2{margin:0;font-family:var(--display);font-weight:700;font-size:26px}
.rest p{margin:0;line-height:1.5}
.pillhold{position:relative;overflow:hidden;border:0;cursor:pointer;border-radius:999px;background:var(--card);box-shadow:0 5px 0 var(--edge);padding:12px 22px;font-family:var(--display);font-weight:600;font-size:17px;border:2px solid var(--edge)}
.pillhold .fill{position:absolute;inset:0;width:0;background:rgba(255,159,28,.35)}
.pillhold.holding .fill{width:100%;transition:width 1.2s linear}
.pillhold .lbl{position:relative}

/* ---------- game ---------- */
.game{--optw:min(40vw,26vh,250px);display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:clamp(6px,1.2vh,14px)}
.game[data-n="3"]{--optw:min(28vw,21vh,210px)}
.topbar{display:flex;align-items:center;gap:10px;min-height:52px;padding-inline-end:60px}
.progress{display:flex;gap:1px;min-width:0;background:rgba(255,255,255,.75);padding:6px 10px;border-radius:999px;box-shadow:0 3px 0 rgba(23,56,63,.1)}
.feather{width:20px;height:20px;color:#fff;flex:none}
.feather.done:nth-child(4n+1){color:var(--leaf)}
.feather.done:nth-child(4n+2){color:var(--berry)}
.feather.done:nth-child(4n+3){color:var(--gold)}
.feather.done:nth-child(4n+4){color:var(--sky-blue)}
.feather.done{animation:pop .45s ease}
.chip{display:flex;align-items:center;gap:8px;margin-inline-start:auto;background:var(--card);border-radius:999px;padding:3px 14px 3px 6px;font-family:var(--display);font-weight:600;font-size:18px;box-shadow:0 3px 0 rgba(23,56,63,.12)}
.chip svg{width:30px;height:30px}
@media (max-width:399px){.chip span{display:none}.chip{padding:3px 6px}.feather{width:17px;height:17px}}
.stage{display:flex;flex-direction:column;align-items:center;min-height:0;gap:clamp(4px,1vh,10px)}
.scene{flex:1;min-height:0;width:100%;display:flex;align-items:flex-end;justify-content:center;gap:2vw}
.scene .koko-slot{height:100%;max-height:48vh;max-width:64vw;flex:none}
.scene.duo .koko-slot{max-width:54vw}
.companions{align-self:stretch;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;width:min(34vw,24vh);flex:none;padding-bottom:4%}
.companions:empty{display:none}
.mate{position:relative;width:100%;aspect-ratio:1;max-height:100%;transition:width .5s ease}
.companions.two .mate{width:84%}
.mate svg.pic{width:100%;height:100%;filter:drop-shadow(0 6px 0 rgba(23,56,63,.12))}
.mate.cue{background:var(--card);border-radius:50%;padding:14%;box-shadow:0 6px 0 rgba(23,56,63,.12)}
.mate.enter{animation:enter .6s cubic-bezier(.3,1.4,.5,1)}
@keyframes enter{0%{transform:scale(.3) translateY(40px);opacity:0}100%{transform:none;opacity:1}}
.mate .snd{position:absolute;top:-6%;inset-inline-end:-18%;background:var(--card);border-radius:16px;padding:3px 10px;font-family:var(--display);font-weight:700;font-size:clamp(14px,2.6vmin,20px);white-space:nowrap;box-shadow:0 3px 0 rgba(23,56,63,.14);opacity:0;transform:scale(.6);transition:opacity .3s,transform .3s cubic-bezier(.3,1.5,.5,1)}
.mate .snd.on{opacity:1;transform:none}

.options{display:flex;justify-content:center;align-items:center;gap:clamp(10px,4vw,40px);min-height:calc(var(--optw) * 1.12 + 10px);padding-bottom:4px}
.options.off{visibility:hidden}
.options.locked .opt{pointer-events:none}
.options.waiting .opt{opacity:.72}
.opt{
  width:var(--optw);aspect-ratio:1/1.12;cursor:pointer;position:relative;background:var(--card);border:0;border-radius:30px;
  box-shadow:0 8px 0 rgba(23,56,63,.16),0 16px 30px rgba(23,56,63,.12);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3%;padding:8% 6% 7%;
  font-family:var(--display);font-weight:600;font-size:clamp(15px,3.1vmin,25px);line-height:1.05;text-align:center;
  transition:opacity .25s ease,transform .25s ease,box-shadow .2s ease;touch-action:manipulation;animation:deal .45s cubic-bezier(.3,1.4,.5,1) both
}
.opt:nth-child(2){animation-delay:.08s}.opt:nth-child(3){animation-delay:.16s}
@keyframes deal{from{transform:translateY(40px) scale(.8);opacity:0}to{transform:none;opacity:1}}
.opt .plate{width:84%;flex:1;min-height:0;border-radius:50%;background:var(--tint);display:grid;place-items:center;aspect-ratio:1}
.opt .plate svg{width:82%;height:82%}
.opt span{max-width:100%}
.opt.right{box-shadow:0 0 0 6px var(--leaf),0 8px 0 var(--leaf-deep),0 16px 30px rgba(23,56,63,.12);animation:pop .5s ease}
.opt.fade{opacity:.25;transform:scale(.9)}
.opt.gone{opacity:0;transform:scale(.6);pointer-events:none}
.opt.shake{animation:shake .45s ease}
.opt.hint{animation:glow2 1.3s ease-in-out infinite}
@keyframes pop{0%{transform:scale(.7)}60%{transform:scale(1.08)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-9px)}50%{transform:translateX(8px)}75%{transform:translateX(-5px)}}
@keyframes glow2{0%,100%{box-shadow:0 8px 0 rgba(23,56,63,.16),0 0 0 0 rgba(255,159,28,0)}50%{box-shadow:0 8px 0 rgba(23,56,63,.16),0 0 0 14px rgba(255,159,28,.5)}}

/* bottom panels: talk time and movement */
.panel{width:min(100%,560px);margin:0 auto;background:var(--card);border-radius:26px;padding:16px 18px;box-shadow:0 8px 0 rgba(23,56,63,.14),0 16px 30px rgba(23,56,63,.12);display:grid;gap:10px;animation:deal .45s cubic-bezier(.3,1.4,.5,1) both;align-self:end}
.panel .ph{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:700;font-size:20px}
.panel .ph svg{width:36px;height:36px;flex:none}
.panel p{margin:0;font-size:clamp(16px,2.6vmin,19px);line-height:1.5;-webkit-user-select:text;user-select:text}
.panel .go{justify-self:center;border:0;cursor:pointer;background:var(--leaf);color:#fff;border-radius:999px;padding:12px 30px;font-family:var(--display);font-weight:600;font-size:19px;box-shadow:0 5px 0 var(--leaf-deep);min-height:52px}
.panel .go:active{transform:translateY(4px);box-shadow:0 1px 0 var(--leaf-deep)}
.panel .go:disabled{opacity:.4;cursor:default}

/* round badge and counting numbers */
.badge{position:fixed;inset:0;z-index:6;display:grid;place-items:center;pointer-events:none}
.badge .disc{width:min(52vmin,300px);aspect-ratio:1;border-radius:50%;background:var(--card);box-shadow:0 0 0 12px var(--tint),0 20px 50px rgba(23,56,63,.25);display:grid;place-items:center;align-content:center;gap:4%;animation:badge 1.8s cubic-bezier(.3,1.3,.5,1) both}
.badge .disc svg{width:48%;height:48%}
.badge .disc b{font-family:var(--display);font-weight:700;font-size:clamp(22px,5vmin,34px)}
@keyframes badge{0%{transform:scale(.2) rotate(-12deg);opacity:0}22%{transform:scale(1.06) rotate(2deg);opacity:1}32%{transform:scale(1) rotate(0)}80%{transform:scale(1);opacity:1}100%{transform:scale(.6) translateY(-30vh);opacity:0}}
.count{position:fixed;inset:0;z-index:6;display:grid;place-items:center;pointer-events:none}
.count b{font-family:var(--display);font-weight:700;font-size:min(34vmin,220px);color:var(--card);-webkit-text-stroke:6px var(--ink);paint-order:stroke;animation:num .9s ease both;text-shadow:0 10px 0 rgba(23,56,63,.2)}
@keyframes num{0%{transform:scale(.3);opacity:0}30%{transform:scale(1.1);opacity:1}70%{opacity:1}100%{transform:scale(1.4);opacity:0}}

/* flying picture (answer travels to its place) */
.flyer{position:fixed;z-index:7;pointer-events:none;will-change:transform}
.flyer svg{width:100%;height:100%;display:block}

@media (orientation:landscape) and (min-aspect-ratio:5/4){
  .game{--optw:min(18vw,34vh,230px);grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);grid-template-rows:auto minmax(0,1fr)}
  .game[data-n="3"]{--optw:min(12.5vw,28vh,180px)}
  .options{gap:clamp(10px,2vw,24px)}
  .topbar{grid-column:1/-1}
  .options{align-self:center;min-height:0;flex-wrap:wrap}
  .game .panel{align-self:center}
  .scene .koko-slot{max-height:64vh}
  .scene.duo .koko-slot{max-width:30vw}
  .companions{width:min(15vw,26vh)}
  .start .koko-slot{height:min(34vh,40vw)}
}

/* ---------- end ---------- */
.end{display:flex;flex-direction:column;align-items:center;gap:clamp(8px,1.6vh,16px);text-align:center;overflow-y:auto;overflow-x:hidden;padding-top:8px;padding-bottom:8px}

.end .koko-slot{height:min(24vh,46vw);flex:none}
.end h2{margin:0;font-family:var(--display);font-weight:700;font-size:clamp(28px,6vmin,46px);line-height:1.05;color:var(--on-world)}
.mission{background:var(--card);border-radius:24px;padding:16px 20px 18px;max-width:560px;width:100%;text-align:start;box-shadow:0 6px 0 rgba(23,56,63,.2)}
.mission .label{font-size:13px;letter-spacing:.04em;font-weight:700;color:var(--sun-deep);margin:0}
.mission h3{margin:.2em 0 .25em;font-family:var(--display);font-weight:600;font-size:clamp(21px,3.4vmin,26px)}
.mission p{margin:0;font-size:clamp(16px,2.5vmin,19px);line-height:1.55;-webkit-user-select:text;user-select:text}
.mission .why{margin-top:.7em;font-size:14px;color:var(--ink-soft);line-height:1.5}
.words{max-width:560px;width:100%}
.words h4{margin:0 0 8px;font-size:14px;letter-spacing:.04em;color:var(--on-world-soft);font-weight:700}
.words .list{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}

.wchip svg{width:30px;height:30px}
.played{margin:0;font-size:14px;color:var(--on-world-soft)}
#againBtn{margin-bottom:auto;flex:none}
@media (max-height:700px){.mission .why{display:none}.end .koko-slot{height:min(17vh,40vw)}.mission{padding:12px 16px 14px}}

/* ---------- grown-ups sheet ---------- */
.sheet-wrap{position:fixed;inset:0;z-index:20;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--cream);width:min(100%,660px);height:min(92%,860px);display:flex;flex-direction:column;border-radius:24px 24px 0 0;-webkit-user-select:text;user-select:text}
@media (min-width:700px) and (min-height:600px){.sheet-wrap{align-items:center}.sheet{border-radius:24px}}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 20px 8px}

.tabs button[aria-selected="true"]{background:var(--card);color:var(--ink);box-shadow:0 2px 0 var(--edge)}
.tabpanes{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;padding:4px 20px calc(24px + env(safe-area-inset-bottom))}
.sheet h3{margin:22px 0 8px;font-family:var(--display);font-weight:600;font-size:20px}
.sheet p,.sheet li{font-size:16px;line-height:1.55;margin:0}
.sheet ol{margin:0;padding-inline-start:1.3em;display:grid;gap:4px}
.sheet .muted{color:var(--ink-soft);font-size:14px}
.why-list{display:grid;gap:10px}
.why-list div{background:var(--card);border-radius:14px;padding:10px 14px;border:2px solid #F0E6CF}
.why-list b{display:block;font-family:var(--display);font-weight:600;font-size:16px;margin-bottom:2px}
.why-list span{font-size:14px;line-height:1.5;color:var(--ink-soft)}
.field{display:grid;gap:6px;margin-top:10px}
.field label{font-weight:700;font-size:15px}
.field input[type=text],.field select{font-size:17px;padding:10px 12px;border-radius:12px;border:2px solid var(--edge);background:var(--card);color:var(--ink);width:100%}
.field input[type=range]{width:100%;accent-color:var(--sun)}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.btn{border:2px solid var(--edge);background:var(--card);border-radius:12px;padding:8px 14px;font-size:15px;cursor:pointer;font-family:var(--body);min-height:40px}
.btn.rec-on{background:var(--berry);border-color:#C53A41;color:#fff}
.btn.warn{border-color:var(--berry);color:#B3262D}
.btn:disabled{opacity:.45;cursor:default}
.status{font-size:14px;color:var(--ink-soft)}
.status.warn{color:#A4540A}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--card);border-radius:14px;padding:10px 14px;border:2px solid #F0E6CF}
.stat small{display:block;color:var(--ink-soft);font-size:13px}
.stat b{font-family:var(--display);font-weight:600;font-size:22px;font-variant-numeric:tabular-nums}
.stat span{font-size:14px;color:var(--ink-soft)}
.wgroup{margin-top:14px}
.wgroup h4{margin:0 0 6px;font-size:14px;letter-spacing:.04em;color:var(--sun-deep)}
.wrow{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:10px;align-items:center;padding:6px 0;border-top:1px solid var(--edge)}
.wrow svg{width:40px;height:40px}
.wrow .w1{font-weight:700;font-size:15px}
.wrow .w2{font-size:13px;color:var(--ink-soft)}
.st{font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap}
.st.new{background:#EEF1F2;color:var(--ink-soft)}
.st.practicing{background:#FFF0D6;color:#A4540A}
.st.knows{background:#DDF5E7;color:var(--leaf-deep)}
.recgroup{margin-top:10px;border-top:1px solid var(--edge)}
.recgroup summary{cursor:pointer;padding:10px 0;font-weight:700;color:var(--sun-deep);font-size:15px}
.recrow{display:grid;grid-template-columns:minmax(0,1fr);gap:6px;padding:10px 0;border-top:1px solid #EFE4CC}
@media (min-width:520px){.recrow{grid-template-columns:minmax(0,1fr) auto;align-items:center}}
.recrow .txt{font-size:15px;line-height:1.4;min-width:0}
.recrow .txt .ok{color:var(--leaf-deep);font-weight:700;font-size:13px;margin-inline-start:6px}
.recrow .acts{display:flex;gap:6px}
.recrow .btn{padding:6px 10px;font-size:14px;min-height:36px}
.close-x{border:0;background:var(--card);width:44px;height:44px;border-radius:50%;font-size:24px;cursor:pointer;line-height:1}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
  .opt.hint{box-shadow:0 8px 0 rgba(23,56,63,.16),0 0 0 8px rgba(255,159,28,.55)}
}

<div id="world" aria-hidden="true"></div>
<div id="app" data-world="sky" dir="rtl" lang="he">

  <section class="screen start" id="screen-start">

'use strict';
/* Koko content: every word Koko says and every label, in Hebrew, Russian and English.

/* Where things sit on Koko (Koko's own drawing units). x,y = centre, s = size, r = degrees, back = behind Koko. */
const PLACE = {

const CATS = [

  { id: 'clothes', icon: 's-sock', world: 'bedroom', tint: '#FFD9E4', items: [

  { id: 'home', icon: 's-cup', world: 'kitchen', tint: '#D6F2FF', items: [

/* ---------- derived helpers ---------- */
function catById(id) { return CATS.find(c => c.id === id); }
function itemById(id) { for (const c of CATS) { const it = c.items.find(i => i.id === id); if (it) return Object.assign({ cat: c.id }, it); } return null; }

/* The three lines for one item: [say, ask, yes] */
function itemLines(lang, item) {
  if (item.cat === 'animals') {
    const L = ANIMAL_LINES[lang], A = ANIMAL[lang];
    const w = Object.assign(A[item.show].slice(), { t: item.target }), t = A[item.target];
    return [L.say(w), L.ask(t), L.yes(t, A[item.show])];
  }
  return ITEM_LINES[lang][item.id];
}

/* The answer cards for an item: [{key, sym, label, color, correct}] - correct first, caller shuffles. */
function itemOptions(lang, item, n) {
  const L = LABEL[lang];
  if (item.cat === 'animals') {
    return [item.target, item.show, item.alt].slice(0, n).map((a, i) => ({ key: a, sym: SYM[a], label: ANIMAL[lang][a][1], correct: i === 0 }));
  }
  if (item.cat === 'colors') {
    return [item.right, item.wrong, item.alt].slice(0, n).map((c, i) => ({ key: c, sym: SYM[item.thing], label: L[c], color: COLORS[c], correct: i === 0 }));
  }
  return [item.right, item.wrong, item.alt].slice(0, n).map((k, i) => ({ key: k, sym: SYM[k], label: L[k], correct: i === 0 }));
}

/* The word an item teaches, for the progress list and the end screen. */
function itemWord(lang, item) {
  if (item.cat === 'animals') return { sym: SYM[item.target], label: ANIMAL[lang][item.target][1] };
  if (item.cat === 'clothes') return { sym: SYM[item.thing], label: LABEL[lang][item.thing] };
  if (item.cat === 'colors') return { sym: SYM[item.thing], label: LABEL[lang][item.right], color: COLORS[item.right] };
  return { sym: SYM[item.right], label: LABEL[lang][item.right] };
}

/* Every line Koko can say in a language: [{id, text, spoken, group}] */
function lineList(lang) {
  const S = SAY[lang], U = UI[lang], sp = SPOKEN[lang];
  const out = [{ id: 'greet', text: S.greet, group: U.groups.start }];
  CATS.forEach(c => {
    const g = U.cat[c.id];
    out.push({ id: 'r_' + c.id, text: S['r_' + c.id], group: g });
    c.items.forEach(it0 => {
      const it = Object.assign({ cat: c.id }, it0), L = itemLines(lang, it);
      out.push({ id: it.id + '_say', text: L[0], group: g }, { id: it.id + '_ask', text: L[1], group: g }, { id: it.id + '_yes', text: L[2], group: g });
    });
    out.push({ id: 'talk_' + c.id, text: S['talk_' + c.id], group: g });
  });
  MOVES.forEach(m => out.push({ id: 'mv_' + m, text: S['mv_' + m], group: U.groups.move }));
  out.push({ id: 'mv_count', text: S.mv_count, group: U.groups.move }, { id: 'mv_done', text: S.mv_done, group: U.groups.move });
  ['recall', 'recall_yes', 'oops', 'bye', 'end'].forEach(id => out.push({ id, text: S[id], group: U.groups.end }));
  out.forEach(l => { l.spoken = sp[l.id] || l.text; });
  return out;
}
function lineText(lang, id) {
  const S = SAY[lang];
  if (S[id] && typeof S[id] === 'string') return S[id];
  const m = /^([a-z]\d)_(say|ask|yes)$/.exec(id);
  if (m) { const it = itemById(m[1]); return itemLines(lang, it)[{ say: 0, ask: 1, yes: 2 }[m[2]]]; }
  return '';
}
function spokenText(lang, id, text) { return SPOKEN[lang][id] || text; }

if (typeof module !== 'undefined') module.exports = { LANGS, LANG_ORDER, CATS, MOVES, UI, SAY, lineList, itemLines, itemOptions, itemWord, itemById };

/* ---------- session planning: spaced, adaptive ---------- */
function planSession() {

  const pri = it => {

}

const speakOrWait = (spoken, text) => (ttsUsable() ? speakTTS(spoken) : wait(estimate(text)));
function say(id, text, o = {}) {
  const k = o.koko || K.game, bubble = o.bubble || $('#bubble'), tok = S.token;
  const rec = S.recs.get(LANG + ':' + id), pack = !rec && packHas(id) && AE.ctx;
  bubble.textContent = (rec || pack) && o.plain ? o.plain : text;
  k.classList.add('talking');
  const spoken = o.tts || spokenText(LANG, id, text);
  const fallback = () => (alive(tok) ? speakOrWait(spoken, text) : null);
  let p;
  if (rec && AE.ctx) p = AE.get('rec:' + LANG + ':' + id, () => blobAB(rec)).then(e => alive(tok) && AE.play(e), () => alive(tok) && playBlob(rec));
  else if (rec) p = playBlob(rec);

function stopAll() {

optionsEl.addEventListener('pointerdown', e => { if (e.isPrimary === false) return; pick(e.target.closest('.opt')); });

/* Scaffolded answer: wrong → Koko asks again; with three cards the wrong one leaves; after two misses or a long pause the answer glows. */
function waitForCorrect(item, tok, ask) {
  return new Promise(resolve => {
    let wrongs = 0, idles = 0, idleTimer = null, settled = false;
    const done = btn => { if (settled) return; settled = true; clearTimeout(idleTimer); S.onPick = null; S.cancelWait = null; resolve({ first: wrongs === 0, btn }); };
    const arm = () => { clearTimeout(idleTimer); idleTimer = setTimeout(onIdle, T(IDLE_MS)); };
    const reask = async () => { setMood(K.game, 'idle'); await say(item.id + '_ask', ask); };
    async function onIdle() {
      if (!alive(tok) || settled) return done(null);
      idles++;
      if (idles > 2) { hint(); return; }
      lockOptions(); await reask();
      if (!alive(tok) || settled) return done(null);
      if (idles >= 2) hint();
      unlockOptions(); arm();
    }
    S.onPick = async btn => {
      lockOptions(); clearTimeout(idleTimer);
      if (btn.dataset.correct === '1') {
        btn.classList.remove('hint'); btn.classList.add('right');
        $$('.opt', optionsEl).forEach(o => { if (o !== btn) o.classList.add('fade'); });
        return done(btn);
      }
      wrongs++;
      const remaining = $$('.opt:not(.gone)', optionsEl).length;
      if (remaining > 2) btn.classList.add('gone');
      else { btn.classList.remove('shake'); void btn.offsetWidth; btn.classList.add('shake'); }
      setMood(K.game, 'wow');
      await say('oops', SAY[LANG].oops);
      if (!alive(tok) || settled) return done(null);
      await reask();
      if (!alive(tok) || settled) return done(null);
      if (wrongs >= 2) hint();
      unlockOptions(); arm();
    };
    S.cancelWait = () => done(null);
    unlockOptions(); arm();
  });
}

/* A picture leaves the card and travels to where it belongs. */
function flyIcon(fromEl, sym, color, to) {
  return new Promise(res => {
    if (!fromEl || !to) return res();
    const r = fromEl.getBoundingClientRect();
    const d = document.createElement('div');
    d.className = 'flyer';
    Object.assign(d.style, { left: r.left + 'px', top: r.top + 'px', width: r.width + 'px', height: r.height + 'px', color: color || '' });
    d.innerHTML = `<svg viewBox="0 0 100 100"><use href="#${sym}"/></svg>`;
    document.body.appendChild(d);
    const dx = to.left + to.width / 2 - (r.left + r.width / 2), dy = to.top + to.height / 2 - (r.top + r.height / 2), sc = to.width / Math.max(1, r.width);
    let fin = false; const end = () => { if (fin) return; fin = true; d.remove(); res(); };
    try {
      const a = d.animate([
        { transform: 'translate(0,0) scale(1)' },
        { transform: `translate(${dx * 0.5}px, ${dy * 0.5 - 90}px) scale(${(1 + sc) / 2 + 0.15}) rotate(-8deg)`, offset: 0.5 },
        { transform: `translate(${dx}px, ${dy}px) scale(${sc})` }
      ], { duration: T(700), easing: 'ease-in-out', fill: 'forwards' });
      a.onfinish = end;
    } catch (e) { end(); }
    setTimeout(end, T(700) + 250);
  });
}

/* ---------- one question ---------- */
function setupItem(item) {
  wearClear(); setMates('');
  if (item.cat === 'animals') setMates(mateHTML(SYM[item.show], item.show, 'enter'));
  else if (item.cat === 'clothes') wearAdd(item.thing, SYM[item.thing], PLACE[item.thing][item.wrong]);
  else if (item.cat === 'home') {
    if (item.prop) wearAdd('prop', SYM[item.prop], PLACE[item.prop]);
    wearAdd('held', SYM[item.wrong], PLACE[item.at]);
  } else if (item.cat === 'colors') wearAdd('held', SYM[item.thing], PLACE.wing, { color: COLORS[item.wrong] });
}
async function resolveItem(item, btn) {
  const plate = btn && btn.querySelector('.plate svg');
  if (item.cat === 'animals') {
    const ph = document.createElement('div'); ph.className = 'mate'; ph.style.visibility = 'hidden'; matesEl.appendChild(ph); matesEl.classList.add('two');
    await flyIcon(plate, SYM[item.target], '', ph.getBoundingClientRect());

async function playItem(item, tok) {

/* ---------- the session ---------- */
function greetText() { return SET.name ? SAY[LANG].greetName(SET.name) : SAY[LANG].greet; }
function clockStart() { S.clock = Date.now(); }
function clockStop() { if (S.clock) { Learn.addMs(Date.now() - S.clock); S.clock = 0; } }

async function startSession() {
  stopAll();
  const tok = S.token;
  S.plan = planSession();
  const plan = S.plan;
  S.startedAt = Date.now(); S.done = 0;
  S.total = plan.rounds.reduce((n, r) => n + r.items.length, 0) + 2;
  renderProgress(); setChip(null); setMates(''); wearClear(); hideOptions(); panelEl.hidden = true; optionsEl.innerHTML = '';
  $('#bubble').textContent = '';
  setWorld(plan.rounds[0].cat.world); setTint(plan.rounds[0].cat.tint);
  setMood(K.game, 'idle'); setAct(K.game, 'flyin');
  show('game');
  AE.unlock(); primeTTS(); requestWake(); clockStart();
  const ids = ['greet', 'oops', 'recall', 'recall_yes', 'bye', 'end', 'mv_' + plan.move, 'mv_count', 'mv_done'];
  plan.rounds.forEach(r => { ids.push('r_' + r.cat.id, 'talk_' + r.cat.id); r.items.forEach(it => ids.push(it.id + '_say', it.id + '_ask', it.id + '_yes')); });
  preloadPack(ids);
  setTimeout(() => { if (alive(tok)) setAct(K.game, null); }, Math.max(300, T(1200)));
  await say('greet', greetText(), { plain: SAY[LANG].greet }); if (!alive(tok)) return;
  for (let i = 0; i < plan.rounds.length; i++) {
    const r = plan.rounds[i];
    setWorld(r.cat.world); setTint(r.cat.tint); setChip(r.cat); setMates(''); wearClear(); hideOptions(); setMood(K.game, 'idle');
    showBadge(r.cat.icon, U().cat[r.cat.id]);
    await say('r_' + r.cat.id, SAY[LANG]['r_' + r.cat.id]); if (!alive(tok)) return;
    for (const item of r.items) { await playItem(item, tok); if (!alive(tok)) return; }
    await talkTime(r.cat, tok); if (!alive(tok)) return;
    if (i === plan.moveAfter && plan.rounds.length > 1) { await moveBreak(plan.move, tok); if (!alive(tok)) return; }
  }
  await recall(plan, tok); if (!alive(tok)) return;
  setMates(''); wearClear(); hideOptions(); setChip(null); setMood(K.game, 'happy');
  await say('bye', SAY[LANG].bye); if (!alive(tok)) return;
  await wait(T(500)); if (!alive(tok)) return;
  finish(plan, tok);
}

async function talkTime(cat, tok) {

async function moveBreak(move, tok) {

  showPanel('s-foot', U().moveTitle, U().moveTip, null);

  setMood(K.game, 'idle'); setAct(K.game, move);

  await counting; if (!alive(tok)) return;

/* Spaced retrieval: a short "do you remember?" from earlier in the game, missed words first. */
async function recall(plan, tok) {
  const missed = plan.played.filter(p => !p.first).map(p => p.item);
  const rest = shuffle(plan.played.filter(p => p.first).map(p => p.item));
  const cand = missed.concat(rest), picks = [];
  for (const it of cand) { if (picks.length >= 2) break; if (!picks.some(p => p.cat === it.cat)) picks.push(it); }
  for (const it of cand) { if (picks.length >= 2) break; if (!picks.includes(it)) picks.push(it); }
  if (!picks.length) return;
  setChip(null); setMates(''); wearClear(); hideOptions(); setWorld('sky'); setTint('#FFF0C2'); setMood(K.game, 'idle');
  showBadge('s-think', U().recallTitle);
  await say('recall', SAY[LANG].recall); if (!alive(tok)) return;
  for (const item of picks) {
    const lines = itemLines(LANG, item);
    setMates(item.cat === 'clothes' ? mateHTML(SYM[item.thing], item.thing, 'cue enter') : '');
    wearClear(); hideOptions();
    renderOptions(item, 2); setMood(K.game, 'idle');
    await say(item.id + '_ask', lines[1]); if (!alive(tok)) return;
    const res = await waitForCorrect(item, tok, lines[1]); if (!alive(tok)) return;
    Learn.record(LANG, item.id, res.first);
    setMood(K.game, 'happy');
    await say('recall_yes', SAY[LANG].recall_yes); if (!alive(tok)) return;
    S.done++; renderProgress();
    await wait(T(400));
  }
}

function finish(plan, tok) {
  clockStop(); releaseWake();
  Learn.addGame();
  const L = Learn.L(LANG);
  plan.rounds.forEach(r => { L.cats[r.cat.id] = Object.assign(L.cats[r.cat.id] || {}, { last: L.sessions }); });
  L.sessions++; Learn.save();
  const cats = plan.rounds.map(r => r.cat.id), last = store.get('lastMission', '');
  let mc = cats[Math.floor(Math.random() * cats.length)];
  if (mc === last && cats.length > 1) mc = cats.find(c => c !== last);
  store.set('lastMission', mc);
  const [mt, mx] = U().missions[mc];
  $('#missionTitle').textContent = mt; $('#missionText').textContent = mx;
  const seen = new Set();
  $('#wordList').innerHTML = plan.played.filter(p => !seen.has(p.item.id) && seen.add(p.item.id)).map(p => {
    const w = itemWord(LANG, p.item);
    return `<span class="wchip"><svg viewBox="0 0 100 100" aria-hidden="true" style="color:${w.color || SYM_COLOR[w.sym] || ''}"><use href="#${w.sym}"/></svg>${esc(w.label)}</span>`;
  }).join('');
  const mins = Math.max(1, Math.round((Date.now() - S.startedAt) / 60000));
  $('#playedFor').textContent = U().played(mins);
  $('#endBubble').textContent = '';
  setWorld('night'); setMood(K.end, 'idle'); show('end');
  say('end', SAY[LANG].end, { koko: K.end, bubble: $('#endBubble') }).then(() => { if (alive(tok)) setMood(K.end, 'sleep'); });
}

function exitToStart() { stopAll(); clockStop(); releaseWake(); panelEl.hidden = true; renderStart(); show('start'); }

/* ---------- wake lock ---------- */
async function requestWake() { try { if ('wakeLock' in navigator) S.wake = await navigator.wakeLock.request('screen'); } catch (e) { S.wake = null; } }
function releaseWake() { try { if (S.wake) S.wake.release(); } catch (e) {} S.wake = null; }

/* ---------- hold-to-activate (grown-ups) ---------- */
function holdable(el, action, ms = 1200) {
  let t = null;
  const cancel = () => { if (t) { clearTimeout(t); t = null; } el.classList.remove('holding'); };
  el.addEventListener('pointerdown', e => { if (e.button > 0) return; cancel(); el.classList.add('holding'); t = setTimeout(() => { t = null; el.classList.remove('holding'); action(); }, ms); });
  ['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => el.addEventListener(ev, cancel));
  el.addEventListener('click', e => { if (e.detail === 0) action(); });
  el.addEventListener('contextmenu', e => e.preventDefault());
}

/* ---------- recordings (IndexedDB, this device only) ---------- */
const idb = {
  db: null,
  open() { return new Promise((res, rej) => { try { const r = indexedDB.open('koko', 1); r.onupgradeneeded = () => r.result.createObjectStore('rec'); r.onsuccess = () => { this.db = r.result; res(this.db); }; r.onerror = () => rej(r.error); } catch (e) { rej(e); } }); },
  async tx(mode, fn) { const db = this.db || await this.open(); return new Promise((res, rej) => { const tx = db.transaction('rec', mode); fn(tx.objectStore('rec')); tx.oncomplete = () => res(); tx.onerror = () => rej(tx.error); }); },
  async all() { const db = this.db || await this.open(); return new Promise((res, rej) => { const out = new Map(); const rq = db.transaction('rec', 'readonly').objectStore('rec').openCursor(); rq.onsuccess = () => { const c = rq.result; if (c) { out.set(c.key, c.value); c.continue(); } else res(out); }; rq.onerror = () => rej(rq.error); }); },
  put(k, v) { return this.tx('readwrite', st => st.put(v, k)); },
  del(k) { return this.tx('readwrite', st => st.delete(k)); }
};
const OLD_IDS = { r1: 'r_animals', r2: 'r_clothes', r3: 'r_home', i1: 'a1', i2: 'a2', i3: 'a3', i4: 'c1', i5: 'c2', i6: 'c3', i7: 'h1', i8: 'h2', i9: 'h3' };
function migrateKey(k) {
  if (String(k).includes(':')) return k;
  const m = /^(i\d)_(say|ask|yes)$/.exec(k);
  if (m) return 'he:' + OLD_IDS[m[1]] + '_' + m[2];
  return 'he:' + (OLD_IDS[k] || k);
}
async function loadRecordings() {
  if (EMBED) return;
  try {
    const all = await idb.all();
    for (const [k, v] of all) {
      const nk = migrateKey(k);
      if (nk !== k) { try { await idb.put(nk, v); await idb.del(k); } catch (e) {} }
      if (v && v.buf) S.recs.set(nk, new Blob([v.buf], { type: v.type || 'audio/mp4' }));
    }
  } catch (e) {}
  updateVoiceUI();
}
const Rec = {
  mr: null, stream: null, id: null, timer: null,
  supported() { return !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia && window.MediaRecorder); },
  async start(id) {
    if (this.mr) this.stop();
    recMsg('');
    try { this.stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true, channelCount: 1 } }); }
    catch (e) { recMsg(U().noMic, true); return; }
    let mr;
    try { mr = new MediaRecorder(this.stream); } catch (e) { recMsg(U().noRecDevice, true); this.stream.getTracks().forEach(t => t.stop()); return; }
    const chunks = [], key = LANG + ':' + id;
    this.mr = mr; this.id = id;
    mr.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
    mr.onstop = async () => {
      const type = mr.mimeType || (chunks[0] && chunks[0].type) || 'audio/mp4';
      const blob = new Blob(chunks, { type });
      try { this.stream.getTracks().forEach(t => t.stop()); } catch (e) {}
      this.mr = null; this.id = null; this.stream = null;
      if (blob.size > 0) {
        S.recs.set(key, blob); AE.buffers.delete('rec:' + key);
        try { await idb.put(key, { buf: await blob.arrayBuffer(), type }); recMsg(U().saved); } catch (e) { recMsg(U().notSaved, true); }
      }
      renderRecList(); updateVoiceUI();
    };
    mr.start();
    this.timer = setTimeout(() => this.stop(), 8000);
    renderRecList();
  },
  stop() { clearTimeout(this.timer); if (this.mr && this.mr.state !== 'inactive') this.mr.stop(); }
};
function recMsg(t, warn) { const el = $('#recMsg'); if (!el) return; el.textContent = t; el.classList.toggle('warn', !!warn); }
function renderRecList() {
  const host = $('#recList'); if (!host) return;
  const groups = [];
  lineList(LANG).forEach(l => { let g = groups.find(x => x.name === l.group); if (!g) groups.push(g = { name: l.group, lines: [] }); g.lines.push(l); });
  const openNames = new Set($$('details[open]', host).map(d => d.dataset.g));
  host.innerHTML = groups.map((g, gi) => {
    const n = g.lines.filter(l => S.recs.has(LANG + ':' + l.id)).length;
    return `<details class="recgroup" data-g="${esc(g.name)}" ${openNames.has(g.name) || (!openNames.size && gi === 0) ? 'open' : ''}><summary>${esc(g.name)} · ${n}/${g.lines.length}</summary>${g.lines.map(l => {
      const has = S.recs.has(LANG + ':' + l.id), on = Rec.id === l.id;
      return `<div class="recrow" data-id="${l.id}"><div class="txt">${esc(l.text)}${has ? `<span class="ok">${esc(U().recorded)}</span>` : ''}</div><div class="acts">
        <button class="btn${on ? ' rec-on' : ''}" type="button" data-act="rec">${esc(on ? U().stop : U().rec)}</button>
        <button class="btn" type="button" data-act="play" ${has ? '' : 'disabled'}>${esc(U().playRec)}</button>
        <button class="btn" type="button" data-act="del" ${has ? '' : 'disabled'} aria-label="${esc(U().delAria)}">${esc(U().del)}</button></div></div>`;
    }).join('')}</details>`;
  }).join('');
}
$('#recList').addEventListener('click', async e => {
  const b = e.target.closest('button[data-act]'); if (!b) return;
  const id = b.closest('.recrow').dataset.id, key = LANG + ':' + id;
  if (b.dataset.act === 'rec') { if (Rec.id === id) Rec.stop(); else Rec.start(id); }
  else if (b.dataset.act === 'play') { const blob = S.recs.get(key); if (blob) { if (S.stopCurrent) S.stopCurrent(); playBlob(blob); } }
  else if (b.dataset.act === 'del') { S.recs.delete(key); AE.buffers.delete('rec:' + key); try { await idb.del(key); } catch (err) {} recMsg(U().deleted); renderRecList(); updateVoiceUI(); }
});

/* ---------- language and static text ---------- */
function tGet(path) { return path.split('.').reduce((o, k) => (o == null ? o : o[k]), U()); }
function applyText() {
  $$('[data-t]').forEach(el => { const v = tGet(el.dataset.t); if (typeof v === 'string') el.textContent = v; });
  $$('[data-ta]').forEach(el => { const v = tGet(el.dataset.ta); if (typeof v === 'string') el.setAttribute('aria-label', v); });
}
function applyLang(lang, persist = true) {
  if (!LANGS[lang]) return;
  if (lang !== LANG) stopAll();
  LANG = lang; if (persist) store.set('lang', lang);
  const dir = LANGS[lang].dir;
  document.documentElement.lang = lang; document.documentElement.dir = dir;
  $('#app').setAttribute('dir', dir); $('#app').setAttribute('lang', lang);
  document.title = U().docTitle;
  S.ttsBroken = 0;
  applyText();
  renderStart();
  loadPack(lang);
  if (!$('#sheet').hidden) renderSheet();
  updateVoiceUI();
}

/* ---------- start screen ---------- */
function resting() { return SET.limit > 0 && Learn.day().games >= SET.limit; }
function renderStart() {
  $('#langs').innerHTML = LANG_ORDER.map(l => `<button type="button" data-lang="${l}" lang="${l}" aria-pressed="${l === LANG}">${LANGS[l].name}</button>`).join('');
  const meta = U().meta.slice(); if (SET.length === 'short') meta[2] = U().metaShort;
  $('#meta').innerHTML = meta.map(m => `<span>${esc(m)}</span>`).join('');
  const rest = resting();
  $('#rest').hidden = !rest; $('#playBtn').hidden = rest; $('#meta').hidden = rest;
  if (rest) { const d = Learn.day(); $('#restText').textContent = U().restText(d.games, Math.max(1, Math.round(d.ms / 60000))); }
  setMood(K.start, rest ? 'sleep' : 'idle');
  if (!$('#screen-start').hidden) { setWorld(rest ? 'night' : 'sky'); setTint('#FFE6B3'); }
  updateVoiceUI();
}
$('#langs').addEventListener('click', e => { const b = e.target.closest('button[data-lang]'); if (b) applyLang(b.dataset.lang); });

/* ---------- grown-ups sheet ---------- */
let tab = 'together';
function voiceStatus() {
  const hasTTS = 'speechSynthesis' in window, v = curVoice();
  if (PACK[LANG]) return [U().vPack, false];
  if (!hasTTS) return [U().vNoTTS, true];
  if (v) return [U().vDevice(v.name), false];
  if (V.count > 0) return [U().vNone, true];
  return [U().vTrying, false];
}
function updateVoiceUI() {
  const noVoice = (!('speechSynthesis' in window) || knownNoVoice()) && !PACK[LANG];
  const anyRec = Array.from(S.recs.keys()).some(k => k.startsWith(LANG + ':'));
  const note = $('#voiceNote'); if (note) note.hidden = !(noVoice && !anyRec) || resting();
  const st = $('#voiceStatus'); if (!st) return;
  const [msg, warn] = voiceStatus(); st.textContent = msg; st.classList.toggle('warn', warn);
  const v = curVoice();
  const tips = $('#voiceTips'); if (tips) tips.hidden = !!PACK[LANG] || (v && voiceScore(v) >= 30);
}
function renderVoiceSelect() {
  const sel = $('#voiceSel'); if (!sel) return;
  const list = V.by[LANG] || [];
  $('#voiceField').hidden = list.length === 0;
  sel.innerHTML = list.map((v, i) => `<option value="${esc(v.voiceURI)}">${esc(v.name)}${i === 0 ? ' ' + esc(U().recommended) : ''}</option>`).join('');
  const cv = curVoice(); if (cv) sel.value = cv.voiceURI;
}
function renderTogether() {
  $('#howList').innerHTML = U().how.map(h => `<li>${esc(h)}</li>`).join('');
  $('#whyList').innerHTML = U().why.map(([b, s]) => `<div><b>${esc(b)}</b><span>${esc(s)}</span></div>`).join('');
  $('#installTip').hidden = EMBED;
}
function renderProgressPane() {
  const d = Learn.day(), w = Learn.week(), min = ms => Math.round(ms / 60000);
  $('#stats').innerHTML = `<div class="stat"><small>${esc(U().today)}</small><b>${esc(U().minN(min(d.ms)))}</b><span>${esc(U().gamesN(d.games))}</span></div><div class="stat"><small>${esc(U().week)}</small><b>${esc(U().minN(min(w.ms)))}</b><span>${esc(U().gamesN(w.g))}</span></div>`;
  $('#wordsPane').innerHTML = CATS.map(c => `<div class="wgroup"><h4>${esc(U().cat[c.id])}</h4>${c.items.map(i0 => {
    const it = Object.assign({ cat: c.id }, i0), w = itemWord(LANG, it), st = Learn.status(LANG, it.id);
    const others = LANG_ORDER.filter(l => l !== LANG).map(l => itemWord(l, it).label).join(' · ');
    return `<div class="wrow"><svg viewBox="0 0 100 100" aria-hidden="true" style="color:${w.color || SYM_COLOR[w.sym] || ''}"><use href="#${w.sym}"/></svg><div><div class="w1">${esc(w.label)}</div><div class="w2">${esc(others)}</div></div><span class="st ${st}">${esc(U().status[st])}</span></div>`;
  }).join('')}</div>`).join('');
}
function renderVoicePane() {
  renderVoiceSelect();
  $('#rate').value = String(SET.rate);
  const canRec = !EMBED && Rec.supported();
  $('#recArea').hidden = !canRec;
  $('#recEmbedNote').hidden = canRec;
  $('#recEmbedNote').textContent = EMBED ? U().recEmbed : U().recUnsupported;
  if (canRec) renderRecList();
  updateVoiceUI();
}
function renderSettingsPane() {
  $('#childName').value = SET.name; $('#childName').placeholder = U().namePh;
  $('#langSel').innerHTML = LANG_ORDER.map(l => `<option value="${l}">${LANGS[l].name}</option>`).join(''); $('#langSel').value = LANG;
  $('#lenSel').innerHTML = `<option value="short">${esc(U().lengthShort)}</option><option value="long">${esc(U().lengthLong)}</option>`; $('#lenSel').value = SET.length;
  $('#levelSel').innerHTML = `<option value="auto">${esc(U().levelAuto)}</option><option value="easy">${esc(U().levelEasy)}</option><option value="hard">${esc(U().levelHard)}</option>`; $('#levelSel').value = SET.level;
  $('#limitSel').innerHTML = [0, 1, 2, 3].map(n => `<option value="${n}">${esc(n ? U().limitN(n) : U().limitOff)}</option>`).join(''); $('#limitSel').value = String(SET.limit);
}
function renderSheet() {
  applyText();
  $$('#tabs [data-tab]').forEach(b => b.setAttribute('aria-selected', String(b.dataset.tab === tab)));
  $$('[data-pane]').forEach(p => { p.hidden = p.dataset.pane !== tab; });
  ({ together: renderTogether, progress: renderProgressPane, voice: renderVoicePane, settings: renderSettingsPane })[tab]();
}
function openSheet() { stopAll(); clockStop(); $('#sheet').hidden = false; renderSheet(); $('#sheetClose').focus(); }
function closeSheet() {
  Rec.stop(); $('#sheet').hidden = true;
  if (!$('#screen-game').hidden) exitToStart(); else renderStart();
}
$('#tabs').addEventListener('click', e => { const b = e.target.closest('[data-tab]'); if (!b) return; tab = b.dataset.tab; Rec.stop(); renderSheet(); });
$('#sheetClose').addEventListener('click', closeSheet);
$('#sheet').addEventListener('click', e => { if (e.target.id === 'sheet') closeSheet(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#sheet').hidden) closeSheet(); });
$('#childName').addEventListener('input', e => { SET.name = e.target.value.trim().slice(0, 20); saveSet(); });
$('#rate').addEventListener('input', e => { SET.rate = Number(e.target.value) || 0.92; saveSet(); });
$('#voiceSel').addEventListener('change', e => { store.set('voice.' + LANG, e.target.value); S.ttsBroken = 0; updateVoiceUI(); });
$('#langSel').addEventListener('change', e => applyLang(e.target.value));
$('#lenSel').addEventListener('change', e => { SET.length = e.target.value; saveSet(); });
$('#levelSel').addEventListener('change', e => { SET.level = e.target.value; saveSet(); });
$('#limitSel').addEventListener('change', e => { SET.limit = Number(e.target.value) || 0; saveSet(); });
$('#testVoice').addEventListener('click', () => { stopAll(); AE.unlock(); primeTTS(); say('greet', greetText(), { koko: K.start, bubble: document.createElement('div'), plain: SAY[LANG].greet }); });
let resetArmed = 0;
$('#resetBtn').addEventListener('click', () => {
  const b = $('#resetBtn');
  if (Date.now() - resetArmed < 3500) { Learn.reset(); resetArmed = 0; b.textContent = U().reset; b.classList.remove('warn'); $('#resetMsg').textContent = U().resetDone; renderProgressPane(); return; }
  resetArmed = Date.now(); b.textContent = U().resetConfirm; b.classList.add('warn');
  setTimeout(() => { if (Date.now() - resetArmed >= 3400) { b.textContent = U().reset; b.classList.remove('warn'); } }, 3600);
});

/* ---------- wiring ---------- */
$('#playBtn').addEventListener('click', () => startSession());
holdable($('#parentBtnStart'), openSheet);
holdable($('#parentBtnEnd'), openSheet);
holdable($('#homeBtn'), exitToStart);
holdable($('#againBtn'), () => startSession());
holdable($('#restHold'), () => startSession());
$('#panelGo').addEventListener('pointerdown', e => e.stopPropagation());

document.addEventListener('contextmenu', e => { if (!e.target.closest('.sheet')) e.preventDefault(); });
document.addEventListener('gesturestart', e => e.preventDefault());
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { try { window.speechSynthesis && window.speechSynthesis.cancel(); } catch (e) {} clockStop(); }
  else if (!$('#screen-game').hidden) { requestWake(); clockStart(); }
});

applyLang(LANG, false);
setWorld(resting() ? 'night' : 'sky');
initVoices();
renderProgress();
loadRecordings();

if (!EMBED && 'serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
}

window.__koko = { markup: kokoMarkup, S, SET, Learn, K, PACK, AE, show, setMood, applyLang, lineList, planSession, voiceScore, get lang() { return LANG; } };

})();
</script>
</body>
</html>
